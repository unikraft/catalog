name: library/mongo:6.0

on:
  schedule:
  - cron: '0 1 * * *'

  push:
    branches: [main]
    paths:
    - 'library/mongo/6.0/**'
    - '.github/workflows/library-mongo6.0.yaml'
    - '!library/mongo/6.0/README.md'

  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
    - 'library/mongo/6.0/**'
    - '.github/workflows/library-mongo6.0.yaml'
    - '!library/mongo/6.0/README.md'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
        - plat: fc
          arch: x86_64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build mongo6.0
      uses: unikraft/kraftkit@staging
      with:
        loglevel: debug
        workdir: library/mongo/6.0
        runtimedir: /github/workspace/.kraftkit
        plat: ${{ matrix.plat }}
        arch: ${{ matrix.arch }}
        push: false
        output: oci://index.unikraft.io/unikraft.org/mongo:6.0

    - name: Archive OCI digests
      uses: actions/upload-artifact@v4
      with:
        name: oci-digests-${{ matrix.arch }}-${{ matrix.plat }}
        path: ${{ github.workspace }}/.kraftkit/oci/digests
        if-no-files-found: error

  push:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: [ build ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to OCI registry
      uses: docker/login-action@v3
      with:
        registry: index.unikraft.io
        username: ${{ secrets.REG_USERNAME }}
        password: ${{ secrets.REG_TOKEN }}

    - name: Retrieve, merge and push OCI digests
      uses: ./.github/actions/merge-oci-digests
      with:
        name: index.unikraft.io/unikraft.org/mongo:6.0
        push: true

  test:
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils socat netcat-openbsd

    - name: Install KraftKit
      run: curl -sSfL https://get.kraftkit.sh | sudo sh -s -- -y

    - name: Build and Run mongo6.0
      env:
        KRAFTKIT_NO_CHECK_UPDATES: true
      run: |
        cd library/mongo/6.0
        kraft build --plat ${{ matrix.plat }} --arch ${{ matrix.arch }}
        kraft run --rm -W -M 4096M -p 27017:27017 --plat ${{ matrix.plat }} --arch ${{ matrix.arch }} . > /tmp/kraft-mongo.log 2>&1 &
        echo $! > /tmp/kraft_pid

    - name: Wait for port 27017
      run: |
        for i in $(seq 1 120); do
          if nc -z 127.0.0.1 27017; then
            echo "Mongo on ${{ matrix.plat }} accepted the connection."
            exit 0
          fi
          sleep 1
        done
        echo "Mongo did not answer after 120 seconds."
        cat /tmp/kraft-mongo.log || true
        exit 1

    - name: Stop mongo instance
      if: ${{ always() }}
      run: |
        if [ -f /tmp/kraft_pid ]; then
          kill "$(cat /tmp/kraft_pid)" || true
        fi
