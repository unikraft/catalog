name: library/hugo:0.122

on:
  repository_dispatch:
    types: [core_merge, elfloader_merge, libelf_merge, lwip_merge]

  workflow_dispatch:

  schedule:
  - cron: '30 0 * * *'

  push:
    branches: [main]
    paths:
    - 'library/hugo/0.122/**'
    - '.github/workflows/library-hugo0.122.yaml'
    - '!library/hugo/0.122/README.md'

  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
    - 'library/hugo/0.122/**'
    - '.github/workflows/library-hugo0.122.yaml'
    - '!library/hugo/0.122/README.md'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
        - plat: fc
          arch: x86_64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build hugo0.122
      uses: unikraft/kraftkit@staging
      with:
        loglevel: debug
        workdir: library/hugo/0.122
        runtimedir: /github/workspace/.kraftkit
        plat: ${{ matrix.plat }}
        arch: ${{ matrix.arch }}
        push: false
        output: oci://index.unikraft.io/unikraft.org/hugo:0.122

    - name: Archive OCI digests
      uses: actions/upload-artifact@v4
      with:
        name: oci-digests-${{ matrix.arch }}-${{ matrix.plat }}
        path: ${{ github.workspace }}/.kraftkit/oci/digests
        if-no-files-found: error

  test:
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
        - plat: fc
          arch: x86_64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install KraftKit
      run: |
        curl -sS https://get.kraftkit.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Test hugo functionality
      if: matrix.plat == 'qemu'
      run: |
        echo "Prepare image on the new server..."
        kraft build --plat ${{ matrix.plat }} --arch ${{ matrix.arch }}

        echo "Start Hugo Unikernel in background"
        kraft run --rm --plat ${{ matrix.plat }} --arch ${{ matrix.arch }} -M 1024M -p 1313:1313 &
        KRAFT_PID=$!

        echo "Wait 5 seconds for the web server to boot"
        sleep 5

        echo "Send HTTP request to Hugo on port 1313"
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:1313/ || echo "000")

        if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
          echo "SUCCESS"
          kill $KRAFT_PID
          exit 0
        else
          echo "ERROR"
          kill $KRAFT_PID
          exit 1
        fi
      working-directory: library/hugo/0.122

  push:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: [ test ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to OCI registry
      uses: docker/login-action@v3
      with:
        registry: index.unikraft.io
        username: ${{ secrets.REG_USERNAME }}
        password: ${{ secrets.REG_TOKEN }}

    - name: Retrieve, merge and push OCI digests
      uses: ./.github/actions/merge-oci-digests
      with:
        name: index.unikraft.io/unikraft.org/hugo:0.122
        push: true
