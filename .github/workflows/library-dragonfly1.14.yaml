name: library/dragonfly:1.14

on:
  schedule:
  - cron: '0 0 * * *'

  push:
    branches: [main]
    paths:
    - 'library/dragonfly/1.14/**'
    - '.github/workflows/library-dragonfly1.14.yaml'
    - '!library/dragonfly/1.14/README.md'

  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
    - 'library/dragonfly/1.14/**'
    - '.github/workflows/library-dragonfly1.14.yaml'
    - '!library/dragonfly/1.14/README.md'

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
        - plat: fc
          arch: x86_64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build dragonfly1.14
      uses: unikraft/kraftkit@staging
      with:
        loglevel: debug
        workdir: library/dragonfly/1.14
        runtimedir: /github/workspace/.kraftkit
        plat: ${{ matrix.plat }}
        arch: ${{ matrix.arch }}
        push: false
        output: oci://index.unikraft.io/unikraft.org/dragonfly:1.14

    - name: Archive OCI digests
      uses: actions/upload-artifact@v4
      with:
        name: oci-digests-${{ matrix.arch }}-${{ matrix.plat }}
        path: ${{ github.workspace }}/.kraftkit/oci/digests
        if-no-files-found: error

  test:
    needs: [ build ]
    strategy:
      fail-fast: false
      matrix:
        include:
        - plat: qemu
          arch: x86_64
        - plat: fc
          arch: x86_64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install KraftKit
      run: |
        curl -sS https://get.kraftkit.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Test Dragonfly functionality
      if: matrix.plat == 'qemu'
      run: |
        echo "Install redis-tools to test connection"
        sudo apt-get update
        sudo apt-get install -y redis-tools

        echo "Prepare image on the new server..."
        kraft build --plat ${{ matrix.plat }} --arch ${{ matrix.arch }}

        echo "Start Dragonfly Unikernel in background"
        kraft run --rm --plat ${{ matrix.plat }} --arch ${{ matrix.arch }} -M 512M -p 6379:6379 &
        KRAFT_PID=$!

        echo "Wait 5 seconds for system boot..."
        sleep 5

        echo "Send PING to Dragonfly on port 6379"
        if redis-cli -h 127.0.0.1 -p 6379 ping | grep -q "PONG"; then
          echo "SUCCESS: Dragonfly answered with PONG"
          kill $KRAFT_PID
          exit 0
        else
          echo "ERROR: Dragonfly did not answer"
          kill $KRAFT_PID
          exit 1
        fi
      working-directory: library/dragonfly/1.14

  push:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    needs: [ test ]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to OCI registry
      uses: docker/login-action@v3
      with:
        registry: index.unikraft.io
        username: ${{ secrets.REG_USERNAME }}
        password: ${{ secrets.REG_TOKEN }}

    - name: Retrieve, merge and push OCI digests
      uses: ./.github/actions/merge-oci-digests
      with:
        name: index.unikraft.io/unikraft.org/dragonfly:1.14
        push: true