name: example/flask3.1-python3.14-sqlite3-base

on:
  push:
    branches: [main]
    paths:
    - 'examples/flask3.1-python3.14-sqlite3-base/**'
    - '.github/workflows/example-flask3.1-python3.14-sqlite3-base.yaml'

  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
    - 'examples/flask3.1-python3.14-sqlite3-base/**'
    - '.github/workflows/example-flask3.1-python3.14-sqlite3-base.yaml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install QEMU dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils

    - name: Install KraftKit
      run: curl -sSfL https://get.kraftkit.sh | sudo sh -s -- -y

    - name: Build and run Flask example
      run: |
        set -euo pipefail
        cd examples/flask3.1-python3.14-sqlite3-base
        kraft --no-prompt --no-check-updates build --plat qemu --arch x86_64
        kraft --no-prompt --no-check-updates run --rm -M 1024M -p 8080:8080 --plat qemu --arch x86_64 . > /tmp/kraft-flask.log 2>&1 &
        kraft_pid=$!
        trap 'kill "$kraft_pid" 2>/dev/null || true' EXIT

        for attempt in $(seq 1 120); do
          if ! kill -0 "$kraft_pid" 2>/dev/null; then
            echo "KraftKit exited before the Flask example became ready."
            cat /tmp/kraft-flask.log
            exit 1
          fi
          if curl --fail --silent http://127.0.0.1:8080/ --output /dev/null; then
            echo "Flask example returned HTTP 200."
            exit 0
          fi
          sleep 1
        done

        echo "Flask example did not return HTTP 200."
        cat /tmp/kraft-flask.log
        exit 1
