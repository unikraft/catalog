
worker_processes      1;
daemon                off;
master_process        off;
user                  root root;


events {
  worker_connections  450;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # not advertising version 
  server_tokens off;

  
  #  falls back to synchronous I/O without logging a startup error.
  #aio off;

  open_file_cache           max=512 inactive=30s;
  open_file_cache_valid     60s;
  open_file_cache_min_uses  2;
  open_file_cache_errors    on;

  
  error_log   stderr error;
  access_log  off;

  keepalive_timeout     10s;
  keepalive_requests    10000;
  send_timeout          10s;

  # response compression.
  gzip              on;
  gzip_comp_level   5;
  gzip_min_length   256;
  gzip_proxied      any;
  gzip_vary         on;
  gzip_types        application/javascript application/json application/xml
                    text/css text/plain text/xml image/svg+xml;

  server {
    listen              80;
    server_name         localhost;

    root                /wwwroot;
    index               index.html;

    #  security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN  always;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
