# Static equivalent of docker-chronyd's generated config
server 0.pool.ntp.org iburst
server 1.pool.ntp.org iburst
server 2.pool.ntp.org iburst
server 3.pool.ntp.org iburst
server time.cloudflare.com iburst
server time1.google.com iburst
server time2.google.com iburst
server time3.google.com iburst
server time4.google.com iburst

# Uncomment if /var/lib/chrony gets a persistent mount.
#driftfile /var/lib/chrony/chrony.drift

# Serve time to any client that can reach us, required for the server role:
# chronyd denies NTP client access entirely when no allow directive is set.
allow all
