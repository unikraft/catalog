# Static equivalent of docker-chronyd's generated config with NTS support 
server time.cloudflare.com iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server nts.netnod.se iburst nts
server ntppool1.time.nl iburst nts
server ntppool2.time.nl iburst nts

# Uncomment if /var/lib/chrony gets a persistent mount.
#driftfile /var/lib/chrony/chrony.drift

# Skips the certificate validity-window check, for platforms that boot with a
# bogus wall clock. Weakens TLS, so treat it as a last resort.
#nosystemcert
#nocerttimecheck 1

# Serve time to any client that can reach us, required for the server role:
# chronyd denies NTP client access entirely when no allow directive is set.
allow all

# Monitoring over UDP 323, off by default. chronyd binds
# the command port to the guest's loopback and denies remote clients. Exposes
# source and timing data, so leave it off unless debugging.
#bindcmdaddress 0.0.0.0
#cmdallow all
